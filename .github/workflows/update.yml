name: Update WaPOR STAC Catalog

on:
  # Run on the 1st, 11th, and 21st of every month at 06:00 UTC
  schedule:
    - cron: "0 6 1,11,21 * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run catalog update
        run: python scripts/update_catalog.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated catalog
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name  "wapor-stac-bot"
          git config user.email "wapor-stac-bot@users.noreply.github.com"
          git add stac/
          ITEM_COUNT=$(find stac -name "*.json" | wc -l | tr -d ' ')
          git commit -m "chore: update STAC catalog $(date +%Y-%m-%d) [${ITEM_COUNT} items]"
          git push

      - name: No changes found
        if: steps.git-check.outputs.changed == 'false'
        run: echo "Catalog is already up to date — nothing to commit."
